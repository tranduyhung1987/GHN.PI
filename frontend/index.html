<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Title & Description -->
    <title>GHN.PI - Giao Hàng Nhanh Thanh Toán Bằng Pi</title>
    <meta name="description" content="Tra cứu cước phí GHN và thanh toán nhanh chóng bằng Pi Network" />
    
    <!-- Pi Network SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    
    <!-- Open Graph / Social Share -->
    <meta property="og:title" content="GHN.PI - Giao Hàng Nhanh Thanh Toán Bằng Pi" />
    <meta property="og:description" content="Tra cứu cước phí GHN và thanh toán nhanh chóng bằng Pi Network" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ghn-pi.vercel.app" />
    <meta property="og:image" content="https://ghn-pi.vercel.app/og-image.jpg" />

    <!-- SEO -->
    <meta name="theme-color" content="#00b140" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ===================== ANIMATION MƯỢT ===================== -->
    <style>
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes scaleIn {
        from { 
          opacity: 0; 
          transform: scale(0.88); 
        }
        to { 
          opacity: 1; 
          transform: scale(1); 
        }
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Card hover mượt */
      .card-hover {
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .card-hover:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 25px -5px rgba(124, 58, 237, 0.18), 
                    0 10px 10px -5px rgba(124, 58, 237, 0.1);
      }

      /* Modal animation đẹp */
      .modal-enter {
        animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* Button press effect */
      .btn-press {
        transition: all 0.2s ease;
      }
      .btn-press:active {
        transform: scale(0.95);
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
