<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4c1d95" />
    
    <!-- Title & Description -->
    <title>GHN.PI - Giao Hàng Nhanh Thanh Toán Bằng Pi</title>
    <meta name="description" content="Giao hàng nhanh nhất Việt Nam - Thanh toán liền mạch bằng Pi Network" />
    
    <!-- Pi Network SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script type="module">
      (async () => {
        try {
          await Pi.init({ version: "2.0", sandbox: true });
          console.log('%c[Pi SDK] Initialized successfully (sandbox mode)', 'color: #22c55e');

        } catch (err) {
          console.error('[Pi SDK] Init failed:', err);
        }
      })();
    </script>

    <!-- Open Graph / Social Share -->
    <meta property="og:title" content="GHN.PI - Giao Hàng Nhanh Thanh Toán Bằng Pi" />
    <meta property="og:description" content="Giao hàng nhanh nhất Việt Nam - Thanh toán liền mạch bằng Pi Network" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ghn-pi.pages.dev" />
    <meta property="og:image" content="https://ghn-pi.pages.dev/og-image.jpg" />

    <!-- SEO & PWA -->
    <meta name="theme-color" content="#4c1d95" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- ===================== ANIMATION & PERFORMANCE ===================== -->
    <style>
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.88); }
        to { opacity: 1; transform: scale(1); }
      }

      .card-hover {
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .card-hover:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 25px -5px rgba(124, 58, 237, 0.18), 
                    0 10px 10px -5px rgba(124, 58, 237, 0.1);
      }

      .btn-press {
        transition: all 0.2s ease;
      }
      .btn-press:active {
        transform: scale(0.95);
        opacity: 0.9;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Ultra early error catcher -->
    <script>
      (function() {
        var shown = false;
        function showHardError(msg) {
          if (shown) return;
          shown = true;
          try {
            var root = document.getElementById('root');
            if (root) {
              root.innerHTML = 
                '<div style="padding:40px;text-align:center;font-family:system-ui;background:#fee2e2;color:#991b1b;min-height:100vh">' +
                '<h2>Ứng dụng gặp lỗi nghiêm trọng</h2>' +
                '<p style="margin:16px 0;font-size:15px;">' + (msg || 'Unknown error') + '</p>' +
                '<button onclick="location.reload()" style="padding:14px 28px;background:#4c1d95;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer;">TẢI LẠI TRANG</button>' +
                '<p style="margin-top:30px;font-size:13px;color:#7f1d1d;">Nếu vẫn lỗi, hãy thử mở bằng trình duyệt ẩn danh hoặc báo lại chi tiết lỗi cho mình.</p>' +
                '</div>';
            }
          } catch(e) {}
        }

        window.addEventListener('error', function(e) {
          console.error('[Early Error]', e.error || e.message);
          showHardError(e.error ? (e.error.message || e.error.toString()) : e.message);
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          console.error('[Early Unhandled Rejection]', e.reason);
          var msg = e.reason && e.reason.message ? e.reason.message : (e.reason ? e.reason.toString() : 'Unhandled error');
          showHardError(msg);
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
